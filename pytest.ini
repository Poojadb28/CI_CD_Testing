[pytest]

# ==========================================================
# TEST DISCOVERY
# ==========================================================

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ==========================================================
# MARKERS
# ==========================================================

markers =
    smoke: smoke tests
    regression: regression tests
    sanity: sanity validation tests
    integration: integration tests
    ui: selenium ui tests
    api: api tests
    slow: long running tests
    flaky: unstable/flaky tests

# ==========================================================
# DEFAULT EXECUTION OPTIONS
# ==========================================================

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=reports/report.html
    --self-contained-html

# ==========================================================
# LOGGING
# ==========================================================

log_cli = true
log_cli_level = INFO

log_file = logs/pytest.log
log_file_level = INFO

log_file_format =
    %(asctime)s | %(levelname)s | %(name)s | %(message)s

log_file_date_format =
    %Y-%m-%d %H:%M:%S

# ==========================================================
# TIMEOUT SETTINGS
# ==========================================================

timeout = 300

# ==========================================================
# CONSOLE OUTPUT
# ==========================================================

console_output_style = progress

# ==========================================================
# CACHE
# ==========================================================

cache_dir = .pytest_cache

# ==========================================================
# WARNINGS
# ==========================================================

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# ==========================================================
# TEST PATHS
# ==========================================================

testpaths =
    tests

# ==========================================================
# JUNIT REPORT
# ==========================================================

junit_family = xunit2